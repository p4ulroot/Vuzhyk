<h1>4.5. Управление пером исполнителя Черепаха</h1>
<p><code>pendown()</code>, <code>pd()</code> — опустить перо вниз, оставлять след при движении, рисовать.</p>
<p><code>penup()</code>, <code>pu()</code> — поднять перо, не оставлять след при движении.</p>
<p><code>pensize()</code> — установить толщину линии, нарисованной пером Черепахи.</p>
