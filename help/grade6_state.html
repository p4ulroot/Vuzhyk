<h1>4.7. Состояние исполнителя Черепаха</h1>
<p><code>position()</code> — получить текущее местоположение черепахи <code>(x, y)</code>.</p>
<p><code>distance(x, y)</code> — получить расстояние до точки <code>(x, y)</code> в шаговых единицах черепахи.</p>
<p><code>towards()</code> — получить угол между линией от положения черепахи к положению, заданному <code>(x, y)</code>.</p>
