[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turtlexy"
version = "1.0.4"
description = "Turtle graphics library with automatic coordinate grid"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "Python Software Foundation License"}
authors = [
    {name = "Grossbeak", email = "grossbeak.pub@gmail.com"}
]
keywords = ["turtle", "graphics", "education", "grid", "coordinates", "axes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Python Software Foundation License",
    "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://docs.python.org/3/library/turtle.html"


